[package]
name = "umseed-probe"
version = "0.1.0"
edition = "2024"

[features]
default = []
cuda = ["umgpu/cuda"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"
serde_json = "1"
flate2 = { version = "1", default-features = false, features = ["zlib-rs"] }
umem = { path = "../umem" }
umgpu = { path = "../umgpu" }
